{% extends "base.html" %}
{% block title %}Confirmer le rendez-vous — {{ clinic.name }}{% endblock %}
{% block content %}
    <h1>Confirmer votre rendez-vous</h1>
    <p>
        {{ provider.full_name }} — {{ service.name }}<br>
        {{ slot_start|date:'l d/m/Y à H:i' }}
    </p>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="provider" value="{{ provider.id }}">
        <input type="hidden" name="service" value="{{ service.id }}">
        <input type="hidden" name="slot" value="{{ slot_start|date:'c' }}">
        {{ form.as_p }}
        <button type="submit">Confirmer le rendez-vous</button>
    </form>
{% endblock %}
