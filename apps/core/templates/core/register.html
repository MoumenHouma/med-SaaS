{% extends "base.html" %}
{% block title %}Créer un compte — Rendia{% endblock %}
{% block content %}
    <h1>Créer votre compte clinique</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Créer le compte</button>
    </form>
    <p><a href="{% url 'login' %}">J'ai déjà un compte</a></p>
{% endblock %}
